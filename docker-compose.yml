
services:
  postgres:
    image: postgres:16
    container_name: application_cache_db
    environment:
      POSTGRES_DB: cache_db
      POSTGRES_USER: cache_user
      POSTGRES_PASSWORD: cache_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache_user -d cache_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

