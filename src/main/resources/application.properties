spring.application.name=spring-boot-with-cache


spring.datasource.url=jdbc:postgresql://localhost:5433/cache_db
spring.datasource.username=cache_user
spring.datasource.password=cache_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
